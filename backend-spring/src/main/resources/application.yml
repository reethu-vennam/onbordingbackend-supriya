server:
  port: 8080

spring:
  application:
    name: sabbpe-backend
  datasource:
    url: ${DB_URL:jdbc:mariadb://192.168.1.10:8306/sabbpeonboarding?useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME:sbuser}
    password: ${DB_PASSWORD:KMmTKeK7yh77odw51gK12f}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        jdbc:
          batch_size: 20
  flyway:
    enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_FILE_SIZE:50MB}

app:
  jwt:
    secret: ${JWT_SECRET:TXlTdXBlclNlY3JldEtleUZvclNhYmJQZUpXVDIwMjZUaGlzSXNWZXJ5TG9uZ0FuZFNlY3VyZQ==}
    expiration-ms: 86400000
    refresh-expiration-ms: 2592000000

  transbank:
    base-url: ${TRANSBANK_BASE_URL:https://transbank.sabbpe.com/api}
    client-id: ${TRANSBANK_CLIENT_ID:5e06f31d-d298-11f0-96ff-4201c0a81e02}
    entity-id: ${TRANSBANK_ENTITY_ID:8116f9f2-f5d1-4e9c-9c2c-988015c140b4}
    program-id: ${TRANSBANK_PROGRAM_ID:513}
    processor: ${TRANSBANK_PROCESSOR:TRANSBANK}
    transaction-type: ${TRANSBANK_TRANSACTION_TYPE:IMPS}

  # Onboarding Team's 5 ecosystem APIs (merchant onboard, token, mandate create/status,
  # subscription) per ONBOARDING_TEAM_GUIDE.md. secret-key and the NACH_MANDATE service
  # credentials are issued out-of-band by that team and must only ever live here (server
  # side) as env vars, never in frontend code.
  ecosystem:
    base-url: ${SABBPE_ECOSYSTEM_BASE_URL:https://ecosystemuat.sabbpe.com}
    secret-key: ${SABBPE_ECOSYSTEM_SECRET_KEY:+Zjed3iEyJjACK0fwG2nOUO6x1NQjBOe99d9C1oPpGo=}
    organization-code-prefix: ${SABBPE_ORG_CODE_PREFIX:MERCH}
    nach-mandate:
      sabbpe-userid: ${SABBPE_NACH_USERID:SB3fabbeba91}
      sabbpe-password: ${SABBPE_NACH_PASSWORD:87657497e4565dc9}
      sabbpe-merchantid: ${SABBPE_NACH_MERCHANTID:271318}
    # Fixed ecosystem callback URLs for UPI AutoPay mandates — NOT our own page. CAMS posts
    # the mandate status/debit result to these; pointing them anywhere else means our system
    # never finds out the mandate went active (confirmed with the mandate team 2026-09-22).
    upi-register-callback-url: ${SABBPE_UPI_REGISTER_CALLBACK_URL:https://ecosystemuat.sabbpe.com/api/v1/upimandate/cams/register/callback}
    upi-debit-url: ${SABBPE_UPI_DEBIT_URL:https://ecosystemuat.sabbpe.com/api/v1/upimandate/cams/execute/callback}
    # HMAC-SHA256 secret shared with the mandate team for verifying X-Sabbpe-Signature on
    # their POST /api/mandates/status-callback webhook. Blank (not yet issued) = signature
    # check is skipped, matching their own documented behavior for an unconfigured secret.
    # This value must exactly match what they configure as sabbpe.onboarding.webhook-secret
    # on their side (shared 2026-09-23).
    webhook-secret: ${SABBPE_ECOSYSTEM_WEBHOOK_SECRET:wtRZu1Nu6hBhXIpbwlloYBlSCAXWznkOXk2bwaOXUFY=}

  notification:
    from-email: ${NOTIFICATION_FROM_EMAIL:payments@sabbpe.com}
    onboarding-team-email: ${NOTIFICATION_ONBOARDING_TEAM_EMAIL:vendor.onboarding@sabbpe.com}

  email:
    host: ${EMAIL_HOST:smtppro.zoho.in}
    port: ${EMAIL_PORT:465}
    username: ${EMAIL_USERNAME:${EMAIL_USER:payments@sabbpe.com}}
    password: ${EMAIL_PASSWORD:${EMAIL_PASS:Tjk5hLgsSKt4}}
    secure: ${EMAIL_SECURE:true}
    from: ${EMAIL_FROM:payments@sabbpe.com}

  settlement:
    dry-run: ${SETTLEMENT_DRY_RUN:false}
    mdr-percentage: ${SETTLEMENT_MDR_PERCENTAGE:1.80}
    reserve-release-business-days: ${SETTLEMENT_RESERVE_RELEASE_DAYS:15}

  webhook:
    secret: ${WEBHOOK_SECRET:}
    api-key: ${WEBHOOK_API_KEY:}

  # Shared secret for server-to-server calls from the Merchant Dashboard backend
  # (e.g. /api/internal/merchant-products/selected-codes). Must match
  # onboarding.internal-api.key in the Dashboard backend's application.properties.
  internal-api:
    key: ${INTERNAL_API_KEY:sabbpe-internal-dev-key}

  upload:
    dir: ${UPLOAD_DIR:./uploads}

  msg91:
    auth-key: ${MSG91_AUTHKEY:441109AdIRodg4B6932ec90P1}
    whatsapp-url: ${MSG91_WHATSAPP_URL:https://api.msg91.com/api/v5/whatsapp/whatsapp-outbound-message/bulk/}
    integrated-number: ${MSG91_INTEGRATED_NUMBER:917304513157}
    template-name: ${MSG91_TEMPLATE_NAME:ekyc_verification}
    namespace: ${MSG91_NAMESPACE:}
    sms-flow-url: ${MSG91_SMS_FLOW_URL:https://control.msg91.com/api/v5/flow}
    sms-template-id: ${MSG91_SMS_TEMPLATE_ID:694e236ec594fc01ba61af73}
    invite-template: ${MSG91_INVITE_TEMPLATE:merchantinv}
    invite-namespace: ${MSG91_INVITE_NAMESPACE:merchant_onboarding}

  demo:
    access-key: ${DEMO_ACCESS_KEY:SABBPE_DEMO_2026}

  admin:
    email: ${ADMIN_EMAIL:payments@sabbpe.com}

logging:
  level:
    root: INFO
    com.sabbpe: ${LOG_LEVEL:DEBUG}
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
