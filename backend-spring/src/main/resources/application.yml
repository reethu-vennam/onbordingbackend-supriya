server:
  port: 8080

spring:
  application:
    name: sabbpe-backend
  datasource:
    url: ${DB_URL:jdbc:mariadb://34.47.168.236:7306/sabbpeonboarding?useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME:sbuser}
    password: ${DB_PASSWORD:KMmTKeK7yh77odw51gK12f}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        jdbc:
          batch_size: 20
  flyway:
    enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_FILE_SIZE:50MB}

